[workspace]
resolver = "2"
members = ["crates/core", "crates/broker", "crates/congress", "crates/data", "crates/chart", "crates/macos", "crates/perf", "app"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tr-perf = { path = "crates/perf" }
tr-core = { path = "crates/core" }
tr-broker = { path = "crates/broker" }
tr-congress = { path = "crates/congress" }
tr-data = { path = "crates/data" }
tr-chart = { path = "crates/chart" }
tr-macos = { path = "crates/macos" }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: saved residual models carry a content digest over f64 bit patterns, so the JSON
# reader must reproduce every written f64 exactly (feature of the existing crate; no new dependency).
# NOTE: this is workspace-wide (Cargo feature unification): ALL serde_json float parsing in every crate
# becomes exact. That is somewhat slower, and a parsed value may differ by 1 ULP from earlier builds.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "json", "gzip", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.8"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev.package."*"]
opt-level = 2
